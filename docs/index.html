<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casino Welcome Bonuses</title>
  <meta name="description" content="Welcome bonus, wagering and minimum deposit for 3 online casinos, scraped and structured automatically.">
  <style>
    :root { --bg:#f7f7f8; --card:#fff; --text:#1a1a1a; --muted:#666; --line:#e3e3e6; --accent:#0b62d6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#121214; --card:#1c1c1f; --text:#ececec; --muted:#9a9aa0; --line:#2e2e33; --accent:#6aa8ff; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .meta { color: var(--muted); font-size: .875rem; margin: 0 0 20px; }
    table { width:100%; border-collapse: collapse; background: var(--card); border:1px solid var(--line); border-radius: 8px; overflow: hidden; }
    th, td { text-align:left; padding: 12px 14px; border-bottom:1px solid var(--line); vertical-align: top; }
    th { font-size:.8rem; text-transform: uppercase; letter-spacing:.04em; color: var(--muted); }
    tr:last-child td { border-bottom: 0; }
    td.num { font-variant-numeric: tabular-nums; }
    a { color: var(--accent); word-break: break-word; }
    .na { color: var(--muted); font-style: italic; }
    .err { color: #c0392b; font-size: .875rem; }
    footer { margin-top: 20px; color: var(--muted); font-size: .8rem; }

    /* Phone: each casino becomes a stacked card */
    @media (max-width: 640px) {
      table, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      table { border: 0; background: none; }
      tr { background: var(--card); border:1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
      td { border: 0; padding: 8px 14px; }
      td::before { content: attr(data-label); display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
      td:first-child { font-weight: 600; font-size: 1.05rem; padding-top: 14px; }
      td:first-child::before { display: none; }
    }
  </style>
</head>
<body>
<main>
  <h1>Casino welcome bonuses</h1>
  <p class="meta" id="meta">Loading…</p>

  <table>
    <thead>
      <tr><th>Casino</th><th>Welcome bonus</th><th>Wagering (×)</th><th>Min. deposit</th><th>Source</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <footer>
    Data is generated by <code>npm run scrape</code> into <code>casinos.json</code>; values the source does not state are shown as “Not stated” rather than guessed.
    18+/21+ only. Gamble responsibly.
  </footer>
</main>

<script>
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cell = (v) => v == null || v === '' ? '<span class="na">Not stated</span>' : esc(v);

  fetch('casinos.json', { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then((data) => {
      const updated = new Date(data.generated_at).toLocaleString();
      document.getElementById('meta').innerHTML =
        `Source: <a href="${esc(data.source.origin)}" rel="noopener">${esc(data.source.name)}</a> · Last updated ${esc(updated)}`;

      document.getElementById('rows').innerHTML = data.casinos.map((c) => `
        <tr>
          <td data-label="Casino">${esc(c.casino)}${c.error ? `<div class="err">Scrape failed: ${esc(c.error)}</div>` : ''}</td>
          <td data-label="Welcome bonus">${cell(c.welcome_bonus)}</td>
          <td data-label="Wagering (×)" class="num">${cell(c.wagering_multiplier)}</td>
          <td data-label="Min. deposit" class="num">${cell(c.minimum_deposit)}</td>
          <td data-label="Source"><a href="${esc(c.source_url)}" rel="noopener nofollow" target="_blank">${esc(new URL(c.source_url).pathname)}</a></td>
        </tr>`).join('');
    })
    .catch((err) => {
      document.getElementById('meta').textContent = 'Could not load casinos.json (' + err.message + '). Run npm run scrape first.';
    });
</script>
</body>
</html>
